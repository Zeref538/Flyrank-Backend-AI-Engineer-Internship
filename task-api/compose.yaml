services:
  api:
    build: .
    ports: ["3000:3000"]
    # Settings come from .env (git-ignored). The one exception: inside compose
    # the database host is the service name `db`, not localhost, so this line
    # overrides the DATABASE_URL in .env, which is written for running the app
    # on your own machine.
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/tasks
    depends_on:
      db:
        # Without this the API starts before Postgres is ready to accept
        # connections and crashes on its first query. depends_on alone only
        # waits for the container to exist, not for the database to be awake.
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tasks
    volumes: [taskdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 20

# A named volume is why data survives `docker compose down` then `up`. Without
# it the rows live inside the container and die with it.
volumes:
  taskdata:
